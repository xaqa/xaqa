<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="xaqa">
  <title>xaqa — ship first, explain never</title>
  <!-- palette sampled from the avatar: sky #83bcd0, body #ffffff, hardware #0b0b0d -->
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#6faec2" stroke-width="1"/>
    </pattern>
    <linearGradient id="acc" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#2b2b31"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <clipPath id="ghost">
      <rect x="40" y="40" width="380" height="106"/>
    </clipPath>
    <clipPath id="type">
      <rect x="60" y="142" width="0" height="38">
        <animate attributeName="width" from="0" to="470" dur="2s" begin="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="220" fill="#83bcd0"/>
  <!-- low-poly facets, same faceted shading as the avatar -->
  <g opacity="0.55">
    <polygon points="0,0 180,0 0,140" fill="#93cbdd"/>
    <polygon points="180,0 90,92 0,140" fill="#8ac3d6"/>
    <polygon points="1000,0 820,0 1000,120" fill="#79b3c7"/>
    <polygon points="1000,220 1000,120 760,220" fill="#8ac3d6"/>
    <polygon points="520,220 640,150 760,220" fill="#93cbdd"/>
    <polygon points="410,0 520,70 340,0" fill="#79b3c7"/>
  </g>
  <rect width="1000" height="220" fill="url(#grid)" opacity="0.55"/>

  <g stroke="#0b0b0d" stroke-width="2" fill="none" opacity="0.75">
    <path d="M14 36V14h22"/>
    <path d="M964 14h22v22"/>
    <path d="M986 184v22h-22"/>
    <path d="M36 206H14v-22"/>
  </g>

  <g>
    <rect x="0" y="-70" width="1000" height="70" fill="url(#scan)">
      <animate attributeName="y" from="-70" to="220" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="-70" width="1000" height="1.5" fill="#ffffff" opacity="0.6">
      <animate attributeName="y" from="-70" to="220" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- shadow paws: black 2D claws bolted onto the white body, snapping instead of easing -->
  <g fill="#0b0b0d">
    <path d="M96 178h26a9 9 0 0 1 0 18H96a9 9 0 0 1 0-18z">
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="0 0;-4 5;2 -3;0 0" keyTimes="0;0.25;0.5;1" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M170 186h30a8 8 0 0 1 0 16h-30a8 8 0 0 1 0-16z">
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="3 -2;-5 4;0 0" keyTimes="0;0.34;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M256 180h22a9 9 0 0 1 0 18h-22a9 9 0 0 1 0-18z">
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="0 0;5 3;-3 1;0 0" keyTimes="0;0.3;0.6;1" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g clip-path="url(#ghost)" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" letter-spacing="2">
    <text x="62" y="118" fill="#0b0b0d" opacity="0" textLength="240" lengthAdjust="spacingAndGlyphs">xaqa
      <animate attributeName="opacity" values="0;0.55;0;0;0.55" keyTimes="0;0.04;0.09;0.72;0.78" dur="3.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 3;0 0;5 -2;0 0" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="58" y="118" fill="#0b0b0d" opacity="0" textLength="240" lengthAdjust="spacingAndGlyphs">xaqa
      <animate attributeName="opacity" values="0;0;0.5;0;0.5" keyTimes="0;0.06;0.1;0.16;0.8" dur="3.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;6 -3;0 0;-4 2;0 0" dur="3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="60" y="118" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" letter-spacing="2" fill="#ffffff" stroke="#0b0b0d" stroke-width="2.5" paint-order="stroke" textLength="240" lengthAdjust="spacingAndGlyphs">xaqa</text>
  <rect x="306" y="52" width="14" height="66" fill="#0b0b0d">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="168" clip-path="url(#type)" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" letter-spacing="1" fill="#0b0b0d" opacity="0.82">ship first, explain never.</text>

  <g transform="translate(760 36)">
    <rect width="184" height="34" rx="17" fill="#ffffff" stroke="#0b0b0d" stroke-width="2"/>
    <circle cx="24" cy="17" r="5" fill="#0b0b0d">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="22" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.5" fill="#0b0b0d">FOCUSING</text>
  </g>

  <g transform="translate(700 190) scale(1 -1)" fill="url(#acc)" opacity="0.9">
    <rect x="0" y="0" width="14" height="18" rx="3"><animate attributeName="height" values="18;64;26;48;18" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="20" y="0" width="14" height="42" rx="3"><animate attributeName="height" values="42;22;58;30;42" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="40" y="0" width="14" height="30" rx="3"><animate attributeName="height" values="30;54;20;46;30" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="60" y="0" width="14" height="56" rx="3"><animate attributeName="height" values="56;28;50;24;56" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="80" y="0" width="14" height="24" rx="3"><animate attributeName="height" values="24;48;16;60;24" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="100" y="0" width="14" height="48" rx="3"><animate attributeName="height" values="48;20;44;28;48" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="120" y="0" width="14" height="34" rx="3"><animate attributeName="height" values="34;62;24;40;34" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="140" y="0" width="14" height="20" rx="3"><animate attributeName="height" values="20;44;30;54;20" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="160" y="0" width="14" height="52" rx="3"><animate attributeName="height" values="52;26;46;22;52" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="180" y="0" width="14" height="28" rx="3"><animate attributeName="height" values="28;50;18;42;28" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="200" y="0" width="14" height="44" rx="3"><animate attributeName="height" values="44;24;56;32;44" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="220" y="0" width="14" height="16" rx="3"><animate attributeName="height" values="16;40;28;52;16" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="240" y="0" width="14" height="50" rx="3"><animate attributeName="height" values="50;30;42;20;50" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="260" y="0" width="14" height="22" rx="3"><animate attributeName="height" values="22;46;34;58;22" dur="2.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
